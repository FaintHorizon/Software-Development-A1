<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">

</head>

<body>

    <div class="container py-4">
        <div class="game-container p-4 mx-auto">

            <!-- Game Title -->
            <h1 class="text-center mb-4">
                Number Guessing Game
            </h1>

            <!-- Difficulty Selection -->
            <div class="text-center mb-4">
                <h3>Select Difficulty</h3>
                <button class="difficulty-button btn m-1">
                    Easy
                </button>
                <button class="difficulty-button btn m-1">
                    Medium
                </button>
                <button class="difficulty-button btn m-1">
                    Hard
                </button>
            </div>

            <!-- Guessing Grid -->
            <div id="guessGrid" class="text-center mb-4">
                <!-- JavaScript will create the guessing rows here -->
            </div>

            <!-- Current Number -->
            <div id="numberBoxes" class="d-flex justify-content-center gap-2 mb-4">
                <!-- JavaScript will create the number boxes here -->
            </div>

            <!-- Keypad -->
            <div class="keypad mx-auto" style="max-width: 350px;">
                <div class="row justify-content-center">
                    <button class="keypad-button btn col-3 m-1">
                        1
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        2
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        3
                    </button>
                </div>

                <div class="row justify-content-center">
                    <button class="keypad-button btn col-3 m-1">
                        4
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        5
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        6
                    </button>
                </div>

                <div class="row justify-content-center">
                    <button class="keypad-button btn col-3 m-1">
                        7
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        8
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        9
                    </button>
                </div>

                <div class="row justify-content-center">
                    <button class="delete-button btn col-3 m-1">
                        DEL
                    </button>
                    <button class="keypad-button btn col-3 m-1">
                        0
                    </button>
                    <button class="enter-button btn col-3 m-1">
                        ENTER
                    </button>
                </div>
            </div>


            <!-- Game Message -->
            <div id="gameMessage" class="game-message text-center mt-4">
                <!-- JavaScript will display messages here -->
            </div>
        </div>
    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
